<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Perfil - Bolso em Dia</title>
    <link rel="icon" href="assets/img/logo-escuro.png" type="image/png">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/rendimentos.css">
    <link rel="stylesheet" href="assets/css/perfil.css">
</head>
<body>
    <div class="pagina-perfil">
        <aside class="menu-lateral">
            <img class="logo-perfil" src="assets/img/logo-horizontal.png" alt="Bolso em Dia">

            <nav class="navegacao-perfil">
                <a href="#">
                    <img src="assets/img/perfil-dashboard.png" alt="">
                    <span>Dashboard</span>
                </a>

                <a href="#" class="rendimentos-perfil">
                    <img src="assets/img/seta-pra-cima-verde.png" alt="">
                    <span><b>Rendimentos</b></span>
                </a>

                <a href="#">
                    <img src="assets/img/perfil-despesas.png" alt="">
                    <span>Despesas</span>
                </a>

                <a href="#">
                    <img src="assets/img/perfil-dia-trabalhado.png" alt="">
                    <span>Dia Trabalhado</span>
                </a>

                <a href="#">
                    <img src="assets/img/perfil-servico-extra.png" alt="">
                    <span>Serviço Extra</span>
                </a>

                <a href="#">
                    <img src="assets/img/perfil-relatorios.png" alt="">
                    <span>Relatórios</span>
                </a>

                <a href="#">
                    <img src="assets/img/perfil-historico.png" alt="">
                    <span>Histórico Semanal</span>
                </a>
            </nav>

            <a class="sair-perfil" href="login.html">
                <img src="assets/img/perfil-sair.png" alt="">
                <span>Sair</span>
            </a>
        </aside>

    <main class="conteudo-perfil">
        <header class="topo-perfil">
            <div></div>

            <div class="usuario-logado">
                <img src="assets/img/perfil-usuario-topo.png" alt="">
                <div>
                    <strong>Rodolfo</strong>
                    <span>rodolfo@email.com</span>
                </div>
            </div>
        </header>

        <div class="linha-topo"></div>


        <div class="cabecalho-rendimentos">
            <section class="titulo-perfil">
                <p>Olá, Rodolfo!</p>
                <h1>Rendimentos</h1>
                <p>Confira seus dias trabalhados, receitas e serviços extras.</p>
            </section>


            <button class="btn-adicionar-rendimento" type="button">
                <img src="assets/img/icone-mais.png" alt="Ícone de +">
                <span>Adicionar rendimento</span>
                <img src="assets/img/chevron-baixo.png" alt="Ícone de seta para baixo">
            </button>
        </div>



        <div class="filtros-rendimentos">
            <button class="filtro ativo" type="button">Todos</button>
            <button class="filtro" type="button">Receitas</button>
            <button class="filtro" type="button">Dias Trabalhados</button>
            <button class="filtro" type="button">Serviços Extras</button>
        </div>


        <section class="meus-rendimentos">

            <h2>Meus Rendimentos</h2>

            <div class="filtros-tabela">
                <div class="campo-busca">
                    <img class="icone-filtro" src="assets/img/lupa-azul-escuro.png" alt="icone de lupa">
                    <input type="text" placeholder="Buscar rendimentos por descrição...">
                </div>

                <button class="filtro-tabela" type="button">
                    <img class="icone-filtro" src="assets/img/calendario-preto.png" alt="icone de caledário">
                    <span>Todos os meses</span>
                    <img class="icone-select" src="assets/img/chevron-baixo-preto.png" alt="Ícone de seta para baixo">
                </button>

                <button class="filtro-tabela" type="button">
                    <img class="icone-filtro" src="assets/img/etiqueta-preta.png" alt="icone de etiqueta">
                    <span>Todas as categorias</span>
                    <img class="icone-select" src="assets/img/chevron-baixo-preto.png" alt="Ícone de seta para baixo">
                </button>

                <button class="filtro-tabela-ordenar" type="button">
                    <span>Ordenar por data</span>
                    <img class="icone-select" src="assets/img/chevron-baixo-preto.png" alt="Ícone de seta para baixo">
                </button>
            </div>


            <div class="tabela-rendimentos-container">
                <table class="tabela-rendimentos">
                    <thead>
                        <tr>
                            <th>
                                <div class="th-ordenacao">
                                    <span>Data</span>
                                    <img class="setas" src="assets/img/setas.png" alt="Icone de uma seta pra cima e outra para baixo">
                                </div>
                            </th>
                            <th>Categoria</th>
                            <th>Descrição</th>
                            <th>
                                <div class="th-ordenacao">
                                    <span>Valor</span>
                                    <img class="setas" src="assets/img/setas.png" alt="Icone de uma seta pra cima e outra para baixo">
                                </div>
                            </th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-rendimentos">

                    </tbody>

                </table>
            </div>
        </section>

    </main>
</body>
</html>
